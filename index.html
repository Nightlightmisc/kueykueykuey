
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Holiday Finder</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="page">

        <header class="header">
            <h1>Holiday Finder</h1>

            <p>
                Find public holidays by country and year.
                Check whether a specific date is a public holiday
                using the free OpenWorkdays API.
            </p>
        </header>

        <main class="container">

            <form id="holidayForm" class="holiday-form">

                <div class="field-group">
                    <label for="cc-input">Country Code</label>

                    <input
                        type="text"
                        id="cc-input"
                        name="countryCode"
                        placeholder="Example: MY, US, GB"
                        value="MY"
                        maxlength="2"
                        pattern="[A-Za-z]{2}"
                        autocomplete="country"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="y-input">Year</label>

                    <input
                        type="number"
                        id="y-input"
                        name="year"
                        min="2024"
                        max="2030"
                        step="1"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="holiday-date">Date to Check</label>

                    <input
                        type="date"
                        id="holiday-date"
                        name="holidayDate"
                        required
                    >
                </div>

                <button type="submit">
                    Search Holidays
                </button>

            </form>

            <p
                id="status-message"
                class="status-message"
                aria-live="polite"
            ></p>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Day</th>
                            <th>Name</th>
                            <th>Type</th>
                        </tr>
                    </thead>

                    <tbody id="table-body">

                        <tr>
                            <td colspan="4" class="empty-state">
                                No holidays loaded yet.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <p class="api-credit">
                Powered by
                <a
                    href="https://openworkdays.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    OpenWorkdays
                </a>
            </p>

        </main>

    </div>

</body>
</html>
